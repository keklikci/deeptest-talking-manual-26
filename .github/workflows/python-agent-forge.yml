# Managed by Python Agent Forge.
name: Python Agent Forge
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-groups
      - run: uv run pytest
      - run: uv run python -m compileall llm oracle sut test_generator evaluation validator text_operators utils
