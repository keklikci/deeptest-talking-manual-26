# Stage-specific sampling and output limits for the three Exida prompts.
generation:
  scene:
    temperature: 0.9
    max_tokens: 100
  intent:
    temperature: 0.4
    max_tokens: 30
  question:
    temperature: 0.8
    max_tokens: 50
  batch_size: 3

# Keep a bounded history so diversity filtering remains inexpensive.
diversity:
  max_recent_questions: 8
  jaccard_threshold: 0.4

exploitation:
  instances_to_add: 1
