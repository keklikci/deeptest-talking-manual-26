[project]
name = "uv-project-metadata"
version = "0.1.0"
description = "A Python project managed with uv."
requires-python = ">=3.11"
dependencies = [
    "black",
    "faiss-cpu",
    "json-repair",
    "lxml",
    "ollama",
    "openai",
    "pandas",
    "pronouncing",
    "pyenchant",
    "python-dotenv",
    "scikit-learn",
    "sentence-transformers",
    "tqdm",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
src = [
    ".",
    "evaluation",
    "llm",
    "oracle",
    "sut",
    "test_generator",
    "text_operators",
    "utils",
    "validator",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
