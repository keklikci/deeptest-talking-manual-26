[project]
name = "uv-project-metadata"
version = "0.1.0"
description = "A Python project managed with uv."
requires-python = ">=3.11"
dependencies = [
    "black",
    "faiss-cpu",
    "json-repair",
    "lxml",
    "ollama",
    "openai",
    "pandas",
    "pronouncing",
    "pyenchant",
    "python-dotenv",
    "scikit-learn",
    "sentence-transformers",
    "tqdm",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
