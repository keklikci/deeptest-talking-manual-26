version: 1
repository: "keklikci/deeptest-talking-manual-26"
base_branch: "main"
python_constraint: "configure-per-repository"
package_manager: "requirements"
source_paths:
  - "llm"
  - "oracle"
  - "sut"
  - "test_generator"
